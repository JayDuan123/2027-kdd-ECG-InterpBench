[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-interpbench"
version = "0.1.0"
description = "Capacity-controlled interpretability benchmarking for ECG foundation models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "einops>=0.7",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "neurokit2>=0.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.1",
    "transformers>=4.40",
    "wfdb>=4.1",
]

[tool.setuptools]
packages = [
    "benchmark_v1",
    "benchmark_v1.adapters",
    "benchmark_v1.sae_extension",
    "benchmark_v1.sae_reconciliation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
